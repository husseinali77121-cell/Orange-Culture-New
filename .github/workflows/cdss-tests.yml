# ============================================================================
# Orange Lab CDSS — automated tests on every push / pull request.
#
# WHERE THIS FILE LIVES:   .github/workflows/cdss-tests.yml
#
# WHAT IT DOES:
#   On every push GitHub starts a clean machine, checks the repo out and runs
#   the whole test suite.  Green check = safe.  Red X = a regression was caught
#   BEFORE it reached Streamlit Cloud.
#
# The suite needs NO streamlit / opencv / tesseract: the clinical engine
# (cdss/) imports only the standard library, and the page (cdss_ui/) is driven
# by a fake Streamlit (tests/support/fake_streamlit.py).  Only pytest is
# installed.
# ============================================================================
name: CDSS Tests

on:
  push:
  pull_request:
  workflow_dispatch:        # lets you also run it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the test runner
        run: python -m pip install -r requirements-dev.txt

      # Names any file that is not the released version BEFORE the suites run,
      # so a stale upload is not misread as a clinical failure. Report-only.
      - name: "Guard 0 — files match the release manifest"
        run: python verify_upload.py

      - name: "Guard 1 — every module compiles"
        run: python -m compileall -q cdss cdss_ui tests streamlit_app.py launcher.py

      # tests/test_architecture.py        layering, rule table, size budget
      # tests/test_outcome_and_engine.py  a caution never hides a later ban
      # tests/test_rules_unit.py          each therapy rule on its own
      # tests/test_aux_tests.py           D-test / penicillinase
      # tests/test_properties.py          partition, determinism, monotonicity
      # tests/test_ui_page.py             the page under a fake Streamlit
      # tests/test_packaging.py           the EXE spec carries every module
      # v7.8 (external review of v7.7): the suite runs in named groups (rules,
      # clinical safety, resistance / pathogenicity, OCR, reports, UI, release
      # gate, packaging, legacy) with one JUnit XML file per group. A group
      # that times out counts as FAILED, and a test file missing from the
      # group map fails the run -- see tools/run_test_groups.py.
      # Guard 3 (the 21 legacy suites) is the "legacy" group of this step.
      - name: "Guard 2 — every test group, JUnit XML per group"
        run: python tools/run_test_groups.py --out test-results

      - name: Keep the JUnit results (also when a group failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/

      - name: "Guard 4 — the deleted parallel build stays deleted"
        run: |
          for d in modules ui data qc.py antibiotics.py; do
            if [ -e "$d" ]; then
              echo "::error::'$d' is back. The application is cdss/ + cdss_ui/ only."
              exit 1
            fi
          done
          n=$(ls *.py | wc -l)
          if [ "$n" -ne 3 ]; then
            echo "::error::expected exactly streamlit_app.py, launcher.py, verify_upload.py at the root; found: $(ls *.py | tr '\n' ' ')"
            exit 1
          fi
          echo "repository layout OK"
